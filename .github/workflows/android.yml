name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: test-results/
  apk:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Generate matching Android and web brand assets
        run: npm run brand:generate
      - run: npm run android:sync
      - name: Restore durable preview signing identity
        if: github.event_name != 'pull_request'
        env:
          GAREEB_SIGNING_KEY: ${{ secrets.GAREEB_SIGNING_KEY }}
        run: |
          test -n "$GAREEB_SIGNING_KEY" || { echo 'Signing secret is required for published APKs'; exit 1; }
          printf '%s' "$GAREEB_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/gareeb-signing.p12"
          chmod 600 "$RUNNER_TEMP/gareeb-signing.p12"
      - name: Build installable APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          GAREEB_SIGNING_STORE: ${{ github.event_name != 'pull_request' && format('{0}/gareeb-signing.p12', runner.temp) || '' }}
          GAREEB_SIGNING_PASSWORD: ${{ secrets.GAREEB_SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify stable preview certificate
        if: github.event_name != 'pull_request'
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee artifacts-certificate.txt
          grep -qi '2184e50e11d905e3e7fc8d9859f7feb2f670c39be35baa3ea01defdfe046f1a0' artifacts-certificate.txt
      - name: Prepare download
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/gareeb-android.apk
          cd artifacts
          sha256sum gareeb-android.apk > gareeb-android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gareeb-android-apk
          path: artifacts/*
          retention-days: 90
      - name: Publish downloadable preview
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gh release create "android-build-${BUILD_NUMBER}" artifacts/* --target "$GITHUB_SHA" --title "Gareeb Android · build ${BUILD_NUMBER}" --prerelease --notes-file docs/RELEASE-NOTES.md
