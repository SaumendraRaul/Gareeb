name: Test released Android APK
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published APK release to test
        required: true
  workflow_run:
    workflows: [Build Android APK]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  device-test:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIOUS_STABLE: "true"
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || format('android-build-{0}', github.event.workflow_run.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Download exact released APK and verify checksum
        run: |
          mkdir -p work/android-qa
          [[ "$RELEASE_TAG" =~ ^android-build-[0-9]+$ ]] || exit 1
          cd work
          curl -fL "https://github.com/SaumendraRaul/Gareeb/releases/download/${RELEASE_TAG}/gareeb-android.apk" -o gareeb-android.apk
          curl -fL "https://github.com/SaumendraRaul/Gareeb/releases/download/${RELEASE_TAG}/gareeb-android.apk.sha256" -o gareeb-android.apk.sha256
          sha256sum -c gareeb-android.apk.sha256
          mv gareeb-android.apk released.apk
          if [[ "$RELEASE_TAG" != 'android-build-12' ]]; then
            curl -fL https://github.com/SaumendraRaul/Gareeb/releases/download/android-build-12/gareeb-android.apk -o previous.apk
            echo 'c51f39eb3c48aac1cbb0da27028775ddb445bb93bee83dd8166232d1e8e6bffd  previous.apk' | sha256sum -c -
          fi
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise released APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: node scripts/android-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-evidence
          path: work/android-qa/
